<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Baraa Jadaan | Portfolio</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages redirection fallback
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/#/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
      (l.search ? '&' + l.search.slice(1) : '') +
      l.hash
    );
  </script>
</head>
<body>
  <p>Redirecting to <a href="/portfolio/">portfolio</a>...</p>
</body>
</html>
